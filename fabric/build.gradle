plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur' version "${minotaur_version}"
}

base {
	archivesName = 'omnivault-recipe-viewer-compat'
}

// Common code is compiled into this jar; build output lives in the root build dir (run dirs, screenshots).
layout.buildDirectory = rootProject.layout.buildDirectory
evaluationDependsOn(':common')
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

// Which recipe viewer the dev client and client gametests run with: -Pviewer=rei (default) or -Pviewer=jei.
def viewer = providers.gradleProperty('viewer').getOrElse('rei')

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "maven.modrinth:omnivault:${project.omnivault_fabric_version}"

	// Both viewers are optional at runtime; only the chosen one is loaded in dev.
	compileOnly "maven.modrinth:rei:${project.rei_fabric_version}"
	compileOnly "maven.modrinth:architectury-api:${project.architectury_fabric_version}"
	compileOnly "me.shedaniel.cloth:basic-math:${project.basic_math_version}"
	compileOnly "maven.modrinth:jei:${project.jei_fabric_version}"
	if (viewer == 'rei') {
		runtimeOnly "maven.modrinth:rei:${project.rei_fabric_version}"
		runtimeOnly "maven.modrinth:architectury-api:${project.architectury_fabric_version}"
		runtimeOnly "maven.modrinth:cloth-config:${project.cloth_config_fabric_version}"
	} else {
		runtimeOnly "maven.modrinth:jei:${project.jei_fabric_version}"
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "omnivault_recipe_viewer_compat_test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true // By setting this to true, you agree to the Minecraft EULA.
	}
}

dependencies {
	gametestCompileOnly "maven.modrinth:rei:${project.rei_fabric_version}"
	gametestCompileOnly "maven.modrinth:architectury-api:${project.architectury_fabric_version}"
	gametestCompileOnly "me.shedaniel.cloth:basic-math:${project.basic_math_version}"
	gametestCompileOnly "maven.modrinth:jei:${project.jei_fabric_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = rootProject.name
	inputs.property "projectName", projectName

	archiveClassifier = 'fabric'
	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName" }
	}
}

def modrinthToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(
		providers.fileContents(layout.projectDirectory.file(
				"${System.getProperty('user.home')}/.config/modrinth-token")).asText.map { it.trim() })

// The changelog section for the current version
def currentChangelog = providers.fileContents(rootProject.layout.projectDirectory.file("CHANGELOG.md")).asText.map { text ->
	def section = text.split(/(?m)^## /).find { it.startsWith("${version}\n") || it.startsWith("${version}\r\n") }
	section ? section.substring(section.indexOf('\n') + 1).trim() : ""
}

modrinth {
	token = modrinthToken
	debugMode = providers.gradleProperty("modrinthDryRun").isPresent()
	projectId = "omnivault-recipe-viewer-compat"
	versionNumber = "${project.version}+fabric"
	versionName = "${project.version} (Fabric)"
	versionType = "release"
	uploadFile = jar
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
	changelog = currentChangelog
	syncBodyFrom = providers.fileContents(rootProject.layout.projectDirectory.file("docs/MODRINTH.md")).asText
	dependencies {
		required.project "omnivault"
		optional.project "rei"
		optional.project "jei"
	}
}

tasks.named("modrinth") { notCompatibleWithConfigurationCache("Minotaur uses Task.project") }
tasks.named("modrinthSyncBody") { notCompatibleWithConfigurationCache("Minotaur uses Task.project") }

// Mute the game during client gametests and tell the test which viewer is loaded.
def gameTestOptions = layout.projectDirectory.file("build/run/clientGameTest/options.txt")
tasks.named("runClientGameTest") {
	systemProperty 'omnivault_recipe_viewer_compat.viewer', viewer
	doFirst {
		def options = gameTestOptions.get().asFile
		options.parentFile.mkdirs()
		def lines = options.exists() ? options.readLines().findAll { !it.startsWith("soundCategory_master:") } : []
		options.text = (lines + "soundCategory_master:0.0").join("\n") + "\n"
	}
}
