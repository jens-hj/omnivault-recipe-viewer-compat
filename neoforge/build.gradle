plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version "${moddev_version}"
	id 'com.modrinth.minotaur' version "${minotaur_version}"
}

base { archivesName = 'omnivault-recipe-viewer-compat' }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }

// Common code and resources are compiled into this jar.
evaluationDependsOn(':common')
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

// Which recipe viewer the dev client runs with: -Pviewer=rei (default) or -Pviewer=jei.
def viewer = providers.gradleProperty('viewer').getOrElse('rei')

neoForge {
	version = project.neoforge_version
	mods { omnivault_recipe_viewer_compat { sourceSet sourceSets.main } }
	runs {
		client { client() }
	}
}

dependencies {
	implementation "maven.modrinth:omnivault:${project.omnivault_neoforge_version}"
	compileOnly "maven.modrinth:rei:${project.rei_neoforge_version}"
	compileOnly "maven.modrinth:architectury-api:${project.architectury_neoforge_version}"
	compileOnly "me.shedaniel.cloth:basic-math:${project.basic_math_version}"
	compileOnly "maven.modrinth:jei:${project.jei_neoforge_version}"
	if (viewer == 'rei') {
		runtimeOnly "maven.modrinth:rei:${project.rei_neoforge_version}"
		runtimeOnly "maven.modrinth:architectury-api:${project.architectury_neoforge_version}"
		runtimeOnly "maven.modrinth:cloth-config:${project.cloth_config_neoforge_version}"
	} else {
		runtimeOnly "maven.modrinth:jei:${project.jei_neoforge_version}"
	}
}

def releaseVersion = project.version.toString()
processResources {
	inputs.property 'version', releaseVersion
	filesMatching('META-INF/neoforge.mods.toml') { expand version: releaseVersion }
}
tasks.named('jar') {
	archiveClassifier = 'neoforge'
	def projectName = rootProject.name
	from(rootProject.file('LICENSE')) { rename { "${it}_$projectName" } }
}
tasks.matching { it.name == 'downloadAssets' }.configureEach {
	javaExecutable = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.map { it.executablePath.asFile.absolutePath }
}

def modrinthToken = providers.environmentVariable('MODRINTH_TOKEN').orElse(
		providers.fileContents(rootProject.layout.projectDirectory.file(
				"${System.getProperty('user.home')}/.config/modrinth-token")).asText.map { it.trim() })
def currentChangelog = providers.fileContents(rootProject.layout.projectDirectory.file('CHANGELOG.md')).asText.map { text ->
	def section = text.split(/(?m)^## /).find { it.startsWith("${version}\n") || it.startsWith("${version}\r\n") }
	section ? section.substring(section.indexOf('\n') + 1).trim() : ''
}
modrinth {
	token = modrinthToken
	debugMode = providers.gradleProperty('modrinthDryRun').isPresent()
	projectId = 'omnivault-recipe-viewer-compat'
	versionNumber = "${project.version}+neoforge"
	versionName = "${project.version} (NeoForge)"
	versionType = 'release'
	uploadFile = jar
	gameVersions = [project.minecraft_version]
	loaders = ['neoforge']
	changelog = currentChangelog
	dependencies {
		required.project 'omnivault'
		optional.project 'rei'
		optional.project 'jei'
	}
}
tasks.named('modrinth') { notCompatibleWithConfigurationCache('Minotaur uses Task.project') }
tasks.named('modrinthSyncBody') { notCompatibleWithConfigurationCache('Minotaur uses Task.project') }

// Every dev launch is silent and skips the first-run screens, so smoke runs stay out of the way.
def clientRunDirectory = file('run')
tasks.named('runClient') {
	doFirst {
		def options = new File(clientRunDirectory, 'options.txt')
		clientRunDirectory.mkdirs()
		def keep = options.exists() ? options.readLines().findAll {
			!it.startsWith('soundCategory_') && !it.startsWith('onboardAccessibility:') && !it.startsWith('narrator:') && !it.startsWith('pauseOnLostFocus:')
		} : []
		options.text = (keep + ['soundCategory_master:0.0', 'soundCategory_music:0.0', 'onboardAccessibility:false', 'narrator:0', 'pauseOnLostFocus:false']).join('\n') + '\n'
	}
}
